<!doctype html>
<html lang="en" class="is-booting">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Link matching colours across a Rubik-style cube." />
    <!-- Home-screen install: launches without browser chrome. iOS ignores the
         manifest display mode and needs the apple-* metas instead. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cubpat" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>Cubpat — colour paths on a cube</title>
    <!-- Critical styles: inline so the first paint is already dark and only shows the loader,
         before the bundle (and styles.css) has loaded. -->
    <style>
      html {
        height: 100%;
        color-scheme: dark;
        background:
          radial-gradient(900px 620px at 50% -12%, #1b2233 0%, rgba(7, 8, 12, 0) 62%),
          radial-gradient(760px 700px at 50% 118%, #111726 0%, rgba(7, 8, 12, 0) 58%),
          #07080c;
        /* Before styles.css loads this is the only background, so it must not
           tile into the gap iOS opens below the layout viewport. */
        background-repeat: no-repeat;
      }
      body {
        margin: 0;
      }
      html.is-booting body > :not(#boot) {
        visibility: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        transition: opacity 0.35s ease;
      }
      #boot.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .boot-face {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 6px;
        border-radius: 14px;
        background: #1c2130;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      .boot-face span {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: #313748;
        animation: boot-path 1.8s ease-in-out calc(var(--i) * 0.09s) infinite;
      }
      @keyframes boot-path {
        8%,
        55% {
          background: hsl(6 83% 58%);
          box-shadow: 0 0 12px hsl(6 83% 58% / 0.55);
        }
        63%,
        100% {
          background: #313748;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-face span {
          animation: none !important;
          background: hsl(6 83% 58%);
        }
      }
    </style>
  </head>
  <body>
    <!-- Removed by main.ts once the first screen is ready. -->
    <div id="boot" role="status" aria-label="Loading">
      <!-- 3×3 cube face; --i is each square's step along a snake-shaped colour path. -->
      <div class="boot-face" aria-hidden="true">
        <span style="--i: 0"></span><span style="--i: 1"></span><span style="--i: 2"></span>
        <span style="--i: 5"></span><span style="--i: 4"></span><span style="--i: 3"></span>
        <span style="--i: 6"></span><span style="--i: 7"></span><span style="--i: 8"></span>
      </div>
    </div>

    <canvas id="scene" aria-label="Cube puzzle"></canvas>

    <div id="hud-level" class="hud-level is-hidden">
      <span class="hud-level-label">Level</span>
      <span id="hud-level-num" class="hud-level-num">1</span>
    </div>

    <div id="hud" class="hud is-hidden">
      <button id="btn-reset" class="icon-btn" type="button" aria-label="Reset level" title="Reset level">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path
            d="M4.5 9.5A7.5 7.5 0 1 1 4.9 15"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path d="M4.2 5.2v4.6h4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="btn-menu" class="icon-btn" type="button" aria-label="Level select" title="Level select">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <g fill="currentColor">
            <rect x="4" y="4" width="6.2" height="6.2" rx="1.6" />
            <rect x="13.8" y="4" width="6.2" height="6.2" rx="1.6" />
            <rect x="4" y="13.8" width="6.2" height="6.2" rx="1.6" />
            <rect x="13.8" y="13.8" width="6.2" height="6.2" rx="1.6" />
          </g>
        </svg>
      </button>
    </div>

    <button id="intro-screen" class="intro is-hidden" type="button" aria-label="Start level">
      <span class="intro-head">
        <span id="intro-area" class="intro-area">Foundations</span>
        <span class="intro-kicker">Level</span>
      </span>
      <span id="intro-level-num" class="intro-num">1</span>
      <span class="intro-meta">
        <span class="intro-dims">
          <span id="intro-cube" class="intro-cube"></span>
          <span id="intro-size" class="intro-size">3×3</span>
        </span>
        <span id="intro-colors" class="intro-colors"></span>
      </span>
    </button>

    <section id="level-screen" class="screen levels">
      <header class="screen-head">
        <h1>Cubpat</h1>
      </header>
      <div class="zone-head">
        <div id="zone-tabs" class="zone-tabs" role="tablist" aria-label="Areas"></div>
      </div>
      <div
        id="level-grid"
        class="level-grid"
        role="tabpanel"
        aria-label="Levels"
      ></div>
      <p class="legend">Link the colors. Fill <b>every</b> square.</p>
    </section>

    <div id="complete" class="solved-bottom is-hidden" role="group" aria-label="Level solved">
      <button id="btn-next" class="icon-btn" type="button" aria-label="Next level" title="Next level">
        <svg viewBox="0 0 36 24" width="42" height="28" aria-hidden="true">
          <path
            d="M7.25 6.5 12.75 12l-5.5 5.5M15.25 6.5 20.75 12l-5.5 5.5M23.25 6.5 28.75 12l-5.5 5.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
